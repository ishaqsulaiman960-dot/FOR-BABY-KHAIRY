<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A question for you 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3b1245; --rose:#ff5c8a; --peach:#ffb199; --gold:#ffd98e; --ink:#fff6f2;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:linear-gradient(160deg,#2a0b3a 0%,#7a1f5c 38%,#ff5c8a 72%,#ffb199 100%);
    background-size:200% 200%;animation:drift 18s ease-in-out infinite alternate;
    display:flex;align-items:center;justify-content:center;
  }
  @keyframes drift{to{background-position:100% 100%}}
  .moon{
    position:fixed;top:8%;right:10%;width:clamp(70px,12vw,140px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff4d6,var(--gold));
    box-shadow:0 0 80px 20px rgba(255,217,142,.35);
  }
  .star{position:fixed;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{50%{opacity:.2}}
  .heart{position:fixed;bottom:-40px;pointer-events:none;animation:rise linear forwards;opacity:.8}
  @keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
  main{
    position:relative;z-index:2;text-align:center;padding:clamp(28px,6vw,56px);
    width:min(92vw,560px);max-height:92vh;overflow-y:auto;border-radius:32px;
    background:rgba(59,18,69,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 60px rgba(30,0,40,.45);
  }
  .small{font-size:1.05rem;opacity:.9;margin-bottom:10px}
  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(2rem,7vw,3.2rem);line-height:1.25;margin-bottom:28px;text-shadow:0 3px 18px rgba(255,92,138,.6)}
  .buttons{display:flex;gap:18px;justify-content:center;align-items:center;min-height:64px}
  button{
    font:700 1.15rem 'Quicksand',sans-serif;border:0;border-radius:999px;padding:14px 38px;cursor:pointer;
    transition:transform .15s,box-shadow .2s;
  }
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #yes{background:linear-gradient(135deg,#ff5c8a,#ff8e72);color:#fff;box-shadow:0 8px 24px rgba(255,92,138,.55)}
  #yes:hover{transform:scale(1.08)}
  #no{background:rgba(255,255,255,.9);color:var(--plum);transition:left .25s ease,top .25s ease}
  #result{display:none}
  #result .big{font-size:5rem;animation:beat 1s infinite}
  @keyframes beat{50%{transform:scale(1.18)}}
  #result p{font-size:1.2rem;margin-top:10px}
  #result h1{margin-bottom:10px}
  #result .lead{margin-top:22px;font-weight:700}
  #reasons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
  .chip{
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;
    padding:8px 16px;font-size:1rem;opacity:0;transform:scale(.6);
    transition:opacity .5s,transform .5s cubic-bezier(.3,1.6,.5,1);
  }
  .chip.show{opacity:1;transform:scale(1)}
  @media (prefers-reduced-motion:reduce){body,.heart,.star,#result .big{animation:none}}
</style>
</head>
<body>
<div class="moon"></div>

<main>
  <section id="ask">
    <p class="small" id="greeting"></p>
    <h1>Will you be my girlfriend?</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No</button>
    </div>
  </section>

  <section id="result">
    <div class="big">💞</div>
    <h1>Yaaay!!! 🎉</h1>
    <p id="love"></p>
    <p class="lead">You asked why I like you? Here's why 💗</p>
    <div id="reasons"></div>
  </section>
</main>

<script>
  // ✏️ EDIT THESE
  const HER_NAME = "Baby Khairy";
  const MESSAGE  = "Yay! You just made me the happiest person alive. 🥰";

  // ✏️ Replace with your real reasons (add or remove as many as you like)
  const REASONS = [
    "Your smile",
    "Your kind heart",
    "The way you make me laugh",
    "How safe I feel with you",
    "Simply being you"
  ];

  document.getElementById('greeting').textContent = "Hey " + HER_NAME + ",";
  document.getElementById('love').textContent = MESSAGE;

  // twinkling stars
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*55+'vh';
    s.style.animationDelay=Math.random()*3+'s';document.body.appendChild(s);
  }

  // floating hearts
  const emojis=['💖','💗','💕','❤️','🌸'];
  function floatHeart(){
    const h=document.createElement('div');h.className='heart';
    h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*26)+'px';
    h.style.animationDuration=(6+Math.random()*6)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),12000);
  }
  setInterval(floatHeart,450);

  // runaway No button
  const no=document.getElementById('no'), yes=document.getElementById('yes');
  let scale=1;
  function dodge(e){
    if(e) e.preventDefault();
    no.style.position='fixed';
    const pad=10, w=no.offsetWidth, h=no.offsetHeight;
    const x=pad+Math.random()*(innerWidth-w-pad*2);
    const y=pad+Math.random()*(innerHeight-h-pad*2);
    no.style.left=x+'px';no.style.top=y+'px';no.style.zIndex=5;
    scale=Math.min(scale+0.12,2.2);           // Yes grows every time No escapes
    yes.style.transform='scale('+scale+')';
  }
  ['mouseenter','pointerdown','touchstart','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));

  // she said yes 🎉
  yes.addEventListener('click',()=>{
    document.getElementById('ask').style.display='none';
    no.remove();
    document.getElementById('result').style.display='block';
    for(let i=0;i<60;i++) setTimeout(floatHeart,i*60);

    const box=document.getElementById('reasons');
    REASONS.forEach((r,i)=>{
      const c=document.createElement('span');
      c.className='chip';c.textContent='💖 '+r;box.appendChild(c);
      setTimeout(()=>c.classList.add('show'),900+i*700);
    });
  });
</script>
</body>
</html>
